[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sanjivsingh22", email = "sanjiv.singh22@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.10.0",
    "isort>=9.0.2",
    "langchain>=1.4.4",
    "langchain-google-genai>=4.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
